name: "AliExpress Coins Bot"
description: "Collects AliExpress daily check-in coins with a persistent Chromium browser session and Home Assistant notifications."
version: "0.1.0"
slug: "aliexpress_bot"
init: false
startup: application
boot: auto
arch:
  - aarch64
  - amd64
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_entry: "/vnc.html?autoconnect=1&resize=scale&path=websockify"
ingress_stream: true
panel_icon: "mdi:alpha-a-circle"
panel_title: "AliExpress Coins"
panel_admin: true

options:
  run_time: "00:20"
  timezone: "Asia/Seoul"
  retry_1_minutes: 5
  retry_2_minutes: 15
  mobile_alert_time: "09:10"
  mobile_notify_entity: "notify.ky17"
  run_on_start: false
  notify_on_failure: true

schema:
  run_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  timezone: str
  retry_1_minutes: "int(1,180)"
  retry_2_minutes: "int(1,360)"
  mobile_alert_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  mobile_notify_entity: str
  run_on_start: bool
  notify_on_failure: bool
